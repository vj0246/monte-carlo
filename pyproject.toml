[project]
name = "variance-clock"
version = "0.1.0"
description = "Variance clock of Indian index options across the 2024/2025 expiry regime changes"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.15",
    "pandas>=2.2",
    "polars>=1.17",
    "pyarrow>=18.0",
    "statsmodels>=0.14",
    "numba>=0.61",
    "matplotlib>=3.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "acceptance: acceptance gates A1..A8 from DECISIONS.md D-18",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"
